# Ma trận RabbitMQ 3.13: bốn biến thể nguồn dữ liệu (xem ../README.md).
# Cổng: management 31311–31314, Prometheus 31321–31324, AMQP 31331–31334
# theo thứ tự full, nostats, noprom, listonly.
name: ocho-sut-313

x-broker: &broker
  image: rabbitmq:4.3-management
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 5s
    timeout: 10s
    retries: 30
  deploy:
    resources:
      limits:
        memory: 512m

x-traffic: &traffic
  image: pivotalrabbitmq/perf-test:latest
  profiles: ["traffic"]
  restart: on-failure

services:
  full:
    <<: *broker
    hostname: full
    ports:
      - "31311:15672"
      - "31321:15692"
      - "31331:5672"
    volumes:
      - ../common/conf.d/10-base.conf:/etc/rabbitmq/conf.d/10-base.conf:ro
      - ../common/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../common/plugins/with-prometheus:/etc/rabbitmq/enabled_plugins:ro

  full-traffic:
    <<: *traffic
    depends_on:
      full:
        condition: service_healthy
    # Một producer có confirm, một consumer: đủ để có connection, channel, consumer và thống kê.
    command: >-
      --uri amqp://ocho-admin:ocho-admin@full:5672/%2F
      --queue ocho.traffic --producers 1 --consumers 1 --rate 2
      --confirm 10 --qos 20 --flag persistent --id full

  nostats:
    <<: *broker
    hostname: nostats
    ports:
      - "31312:15672"
      - "31322:15692"
      - "31332:5672"
    volumes:
      - ../common/conf.d/10-base.conf:/etc/rabbitmq/conf.d/10-base.conf:ro
      - ../common/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../common/plugins/with-prometheus:/etc/rabbitmq/enabled_plugins:ro
      - ../common/nostats.conf:/etc/rabbitmq/conf.d/20-nostats.conf:ro

  nostats-traffic:
    <<: *traffic
    depends_on:
      nostats:
        condition: service_healthy
    # Một producer có confirm, một consumer: đủ để có connection, channel, consumer và thống kê.
    command: >-
      --uri amqp://ocho-admin:ocho-admin@nostats:5672/%2F
      --queue ocho.traffic --producers 1 --consumers 1 --rate 2
      --confirm 10 --qos 20 --flag persistent --id nostats

  noprom:
    <<: *broker
    hostname: noprom
    ports:
      - "31313:15672"
      - "31323:15692"
      - "31333:5672"
    volumes:
      - ../common/conf.d/10-base.conf:/etc/rabbitmq/conf.d/10-base.conf:ro
      - ../common/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../common/plugins/without-prometheus:/etc/rabbitmq/enabled_plugins:ro

  noprom-traffic:
    <<: *traffic
    depends_on:
      noprom:
        condition: service_healthy
    # Một producer có confirm, một consumer: đủ để có connection, channel, consumer và thống kê.
    command: >-
      --uri amqp://ocho-admin:ocho-admin@noprom:5672/%2F
      --queue ocho.traffic --producers 1 --consumers 1 --rate 2
      --confirm 10 --qos 20 --flag persistent --id noprom

  listonly:
    <<: *broker
    hostname: listonly
    ports:
      - "31314:15672"
      - "31324:15692"
      - "31334:5672"
    volumes:
      - ../common/conf.d/10-base.conf:/etc/rabbitmq/conf.d/10-base.conf:ro
      - ../common/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../common/plugins/without-prometheus:/etc/rabbitmq/enabled_plugins:ro
      - ../common/nostats.conf:/etc/rabbitmq/conf.d/20-nostats.conf:ro

  listonly-traffic:
    <<: *traffic
    depends_on:
      listonly:
        condition: service_healthy
    # Một producer có confirm, một consumer: đủ để có connection, channel, consumer và thống kê.
    command: >-
      --uri amqp://ocho-admin:ocho-admin@listonly:5672/%2F
      --queue ocho.traffic --producers 1 --consumers 1 --rate 2
      --confirm 10 --qos 20 --flag persistent --id listonly

  full-legacy-traffic:
    <<: *traffic
    depends_on:
      full:
        condition: service_healthy
    # Client kiểu cũ trên queue classic work.classic: publish không confirm (R1),
    # consumer auto-ack (C1) chậm hơn producer nên queue có tồn (T1).
    command: >-
      --uri amqp://ocho-admin:ocho-admin@full:5672/%2F
      --queue work.classic --predeclared --producers 1 --consumers 1
      --rate 5 --consumer-rate 1 --autoack --id full-legacy

  full-mirroring:
    image: curlimages/curl:latest
    profiles: ["traffic"]
    depends_on:
      full:
        condition: service_healthy
    # Chỉ 3.13: classic queue mirroring (VT1). 4.x từ chối khoá ha-*, nên không
    # để trong definitions.json chung.
    # Chạy tiếp sau khi đặt policy để `up --wait` không coi container đã thoát là lỗi.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -sf -u ocho-admin:ocho-admin -X PUT -H content-type:application/json
        http://full:15672/api/policies/%2F/legacy-ha
        -d '{"pattern":"^legacy$$","apply-to":"queues","priority":0,"definition":{"ha-mode":"all"}}'
        && exec sleep infinity

  nostats-legacy-traffic:
    <<: *traffic
    depends_on:
      nostats:
        condition: service_healthy
    # Client kiểu cũ trên queue classic work.classic: publish không confirm (R1),
    # consumer auto-ack (C1) chậm hơn producer nên queue có tồn (T1).
    command: >-
      --uri amqp://ocho-admin:ocho-admin@nostats:5672/%2F
      --queue work.classic --predeclared --producers 1 --consumers 1
      --rate 5 --consumer-rate 1 --autoack --id nostats-legacy

  nostats-mirroring:
    image: curlimages/curl:latest
    profiles: ["traffic"]
    depends_on:
      nostats:
        condition: service_healthy
    # Chỉ 3.13: classic queue mirroring (VT1). 4.x từ chối khoá ha-*, nên không
    # để trong definitions.json chung.
    # Chạy tiếp sau khi đặt policy để `up --wait` không coi container đã thoát là lỗi.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -sf -u ocho-admin:ocho-admin -X PUT -H content-type:application/json
        http://nostats:15672/api/policies/%2F/legacy-ha
        -d '{"pattern":"^legacy$$","apply-to":"queues","priority":0,"definition":{"ha-mode":"all"}}'
        && exec sleep infinity

  noprom-legacy-traffic:
    <<: *traffic
    depends_on:
      noprom:
        condition: service_healthy
    # Client kiểu cũ trên queue classic work.classic: publish không confirm (R1),
    # consumer auto-ack (C1) chậm hơn producer nên queue có tồn (T1).
    command: >-
      --uri amqp://ocho-admin:ocho-admin@noprom:5672/%2F
      --queue work.classic --predeclared --producers 1 --consumers 1
      --rate 5 --consumer-rate 1 --autoack --id noprom-legacy

  noprom-mirroring:
    image: curlimages/curl:latest
    profiles: ["traffic"]
    depends_on:
      noprom:
        condition: service_healthy
    # Chỉ 3.13: classic queue mirroring (VT1). 4.x từ chối khoá ha-*, nên không
    # để trong definitions.json chung.
    # Chạy tiếp sau khi đặt policy để `up --wait` không coi container đã thoát là lỗi.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -sf -u ocho-admin:ocho-admin -X PUT -H content-type:application/json
        http://noprom:15672/api/policies/%2F/legacy-ha
        -d '{"pattern":"^legacy$$","apply-to":"queues","priority":0,"definition":{"ha-mode":"all"}}'
        && exec sleep infinity

  listonly-legacy-traffic:
    <<: *traffic
    depends_on:
      listonly:
        condition: service_healthy
    # Client kiểu cũ trên queue classic work.classic: publish không confirm (R1),
    # consumer auto-ack (C1) chậm hơn producer nên queue có tồn (T1).
    command: >-
      --uri amqp://ocho-admin:ocho-admin@listonly:5672/%2F
      --queue work.classic --predeclared --producers 1 --consumers 1
      --rate 5 --consumer-rate 1 --autoack --id listonly-legacy

  listonly-mirroring:
    image: curlimages/curl:latest
    profiles: ["traffic"]
    depends_on:
      listonly:
        condition: service_healthy
    # Chỉ 3.13: classic queue mirroring (VT1). 4.x từ chối khoá ha-*, nên không
    # để trong definitions.json chung.
    # Chạy tiếp sau khi đặt policy để `up --wait` không coi container đã thoát là lỗi.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        curl -sf -u ocho-admin:ocho-admin -X PUT -H content-type:application/json
        http://listonly:15672/api/policies/%2F/legacy-ha
        -d '{"pattern":"^legacy$$","apply-to":"queues","priority":0,"definition":{"ha-mode":"all"}}'
        && exec sleep infinity

  full-backlog-traffic:
    <<: *traffic
    depends_on:
      full:
        condition: service_healthy
    # Consumer ack thủ công, qos 1, chậm hơn producer: queue classic work.backlog có tồn (T1).
    command: >-
      --uri amqp://ocho-admin:ocho-admin@full:5672/%2F
      --queue work.backlog --predeclared --producers 1 --consumers 1
      --rate 5 --consumer-rate 1 --qos 1 --confirm 10 --id full-backlog

  nostats-backlog-traffic:
    <<: *traffic
    depends_on:
      nostats:
        condition: service_healthy
    # Consumer ack thủ công, qos 1, chậm hơn producer: queue classic work.backlog có tồn (T1).
    command: >-
      --uri amqp://ocho-admin:ocho-admin@nostats:5672/%2F
      --queue work.backlog --predeclared --producers 1 --consumers 1
      --rate 5 --consumer-rate 1 --qos 1 --confirm 10 --id nostats-backlog

  noprom-backlog-traffic:
    <<: *traffic
    depends_on:
      noprom:
        condition: service_healthy
    # Consumer ack thủ công, qos 1, chậm hơn producer: queue classic work.backlog có tồn (T1).
    command: >-
      --uri amqp://ocho-admin:ocho-admin@noprom:5672/%2F
      --queue work.backlog --predeclared --producers 1 --consumers 1
      --rate 5 --consumer-rate 1 --qos 1 --confirm 10 --id noprom-backlog

  listonly-backlog-traffic:
    <<: *traffic
    depends_on:
      listonly:
        condition: service_healthy
    # Consumer ack thủ công, qos 1, chậm hơn producer: queue classic work.backlog có tồn (T1).
    command: >-
      --uri amqp://ocho-admin:ocho-admin@listonly:5672/%2F
      --queue work.backlog --predeclared --producers 1 --consumers 1
      --rate 5 --consumer-rate 1 --qos 1 --confirm 10 --id listonly-backlog
