# Test hiệu năng của `ocho` và các gói nó dùng: đo giờ so với ngân sách của spec,
# nên tách khỏi CI thường (máy CI bận làm số đo nhiễu, và không nên chặn merge).
#
# - `test:perf` của model (buildActual 10.000 queue ≤ 500 ms), rules (mọi luật
#   trên 10.000 queue ≤ 1 giây), compiler (import 10.000 queue ≤ 2 giây), cli
#   (doctor ≤ 3 phút ở 5 request/giây, explain ≤ 2 giây, dòng xác nhận ≤ 100 ms).
# - Khởi động của binary SEA trên 4 nền tảng: `ocho --version` ≤ 100 ms p95.
#
# Chạy hằng tuần, khi gọi tay, hoặc trên PR có nhãn `perf`.

name: CLI perf

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      node-version:
        description: Node cho test:perf
        type: choice
        options: ["24", "22", "20"]
        default: "24"
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-perf:
    name: test:perf (Node ${{ inputs.node-version || '24' }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@ochotona/cli...
      # Lần lượt từng gói, để các phép đo không tranh CPU với nhau. Một gói
      # vượt ngân sách vẫn để các gói sau chạy, rồi job mới báo lỗi.
      - name: test:perf
        run: pnpm --filter "@ochotona/cli..." --workspace-concurrency=1 --no-bail --if-present test:perf

  sea:
    name: SEA
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    uses: ./.github/workflows/cli-sea.yml
    with:
      retention-days: 1

  startup:
    name: Startup ${{ matrix.target }}
    needs: sea
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, exe: "" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, exe: "" }
          - { os: macos-15, target: darwin-arm64, exe: "" }
          - { os: windows-2025, target: win-x64, exe: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: node/packages/cli/scripts
      # Chỉ để chạy script đo; binary mang node của chính nó.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ocho-${{ matrix.target }}
          path: sea
      - name: Extract
        working-directory: sea
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then 7z x -y ./*.zip > /dev/null; else tar -xzf ./*.tar.gz; fi
          ls -l
      # Trên Windows chỉ báo cáo: Defender quét file thực thi mới làm số đo
      # không còn là của Ocho.
      - name: ocho --version ≤ 100 ms p95
        run: >
          node node/packages/cli/scripts/startup.mjs sea/ocho${{ matrix.exe }}
          ${{ runner.os == 'Windows' && '--report-only' || '' }}
