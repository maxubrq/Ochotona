# Phát hành `ocho` tự động bằng release-please.
#
# 1. Mỗi lần push lên main, release-please đọc commit theo Conventional Commits
#    (feat:, fix:, feat!: …) kể từ lần phát hành trước, rồi mở hoặc cập nhật một
#    PR "chore(main): release cli x.y.z": nâng phiên bản trong
#    node/packages/cli/package.json, src/version.ts, node/package.json, cùng
#    node/packages/tui/package.json, src/version.ts (TUI phát hành cùng CLI), và
#    viết node/packages/cli/CHANGELOG.md.
# 2. Merge PR đó thì release-please tạo tag cli-vX.Y.Z và GitHub Release; job
#    build dựng binary SEA của `ocho` và `ocho-tui` từ đúng tag, job publish
#    đính kèm archive, binary, SHA256SUMS và attestation nguồn gốc vào release.
#
# Chạy tay với `tag` để dựng lại và đính kèm binary cho một release đã có.
#
# Xem node/packages/cli/docs/release.md.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag đã phát hành cần (dựng lại và) đính kèm binary, ví dụ cli-v0.1.0
        type: string
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write # nhãn "autorelease: pending" trên PR phát hành
    outputs:
      created: ${{ steps.rp.outputs['node--release_created'] }}
      tag: ${{ steps.rp.outputs['node--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          # PR mở bằng GITHUB_TOKEN không kích hoạt workflow khác (CI sẽ không
          # chạy trên PR phát hành). Đặt secret RELEASE_PLEASE_TOKEN (PAT hoặc
          # token của GitHub App) để CI chạy trên PR đó.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tag cần dựng: vừa được release-please tạo, hoặc nhập tay.
  target:
    needs: release-please
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.created == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in cli-v*) ;; *) echo "::error::tag phải có dạng cli-vX.Y.Z, nhận được '$TAG'"; exit 1 ;; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: target
    permissions:
      contents: read
    uses: ./.github/workflows/cli-sea.yml
    with:
      ref: ${{ needs.target.outputs.tag }}
      retention-days: 30

  build-tui:
    needs: target
    permissions:
      contents: read
    uses: ./.github/workflows/tui-sea.yml
    with:
      ref: ${{ needs.target.outputs.tag }}
      retention-days: 30

  # Chạy cả khi một nền tảng hỏng: đính kèm những gì đã dựng và qua test, rồi
  # báo đỏ nếu thiếu nền tảng nào, thay vì để release không có binary nào.
  publish:
    needs: [target, build, build-tui]
    if: always() && needs.target.result == 'success' && needs.build.result != 'cancelled' && needs.build-tui.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # đính kèm file vào release
      id-token: write # ký attestation
      attestations: write
    env:
      TAG: ${{ needs.target.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ocho-*
          path: dist
          merge-multiple: true

      - name: Checksums
        id: files
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(ocho-*)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::không có binary nào được dựng"; exit 1; fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          missing=""
          for t in linux-x64 linux-arm64 darwin-arm64 win-x64; do
            ls ocho-[0-9]*-"$t"* > /dev/null 2>&1 || missing="$missing ocho/$t"
            ls ocho-tui-*-"$t"* > /dev/null 2>&1 || missing="$missing ocho-tui/$t"
          done
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"

      # Người dùng kiểm được binary dựng từ đúng commit này:
      # gh attestation verify ocho-<...> --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ocho-*

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: All platforms present
        if: steps.files.outputs.missing != ''
        run: |
          echo "::error::release $TAG thiếu binary cho: ${{ steps.files.outputs.missing }}"
          exit 1
