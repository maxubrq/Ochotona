# CI của `ocho-tui` (packages/tui): kiểm mã, test trên Node 22, 24 (Ink 8 cần
# Node ≥ 22), test `dist/bin`, rồi dựng binary SEA cho 4 nền tảng và chạy test
# trên chính binary. TUI dựng trên CLI, nên mọi thay đổi trong node/ đều chạy.

name: TUI CI

on:
  pull_request:
    paths:
      - node/**
      - SUT/common/definitions.json
      - .github/workflows/tui-*.yml
  push:
    branches: [main]
    paths:
      - node/**
      - SUT/common/definitions.json
      - .github/workflows/tui-*.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: node

jobs:
  check:
    name: Typecheck, format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@ochotona/tui...
      - run: pnpm --filter @ochotona/tui typecheck
      - run: pnpm --filter @ochotona/tui format

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@ochotona/tui...
      # Gồm test/bin.test.ts trên dist/bin/ocho-tui.js vừa dựng.
      - run: pnpm --filter @ochotona/tui test

  sea:
    name: SEA
    needs: [check, test]
    uses: ./.github/workflows/tui-sea.yml
